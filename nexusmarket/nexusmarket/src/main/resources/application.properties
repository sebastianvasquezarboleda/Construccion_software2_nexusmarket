spring.application.name=nexusmarket
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket}
spring.data.mongodb.auto-index-creation=true
nexusmarket.cors.allowed-origins=${NEXUSMARKET_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
nexusmarket.security.csrf-cookie-secure=${NEXUSMARKET_CSRF_COOKIE_SECURE:true}
nexusmarket.security.csrf-cookie-same-site=${NEXUSMARKET_CSRF_COOKIE_SAME_SITE:Lax}
nexusmarket.orders.cart-expiration=${NEXUSMARKET_CART_EXPIRATION:PT30M}
nexusmarket.orders.expiration-scan-ms=${NEXUSMARKET_CART_EXPIRATION_SCAN_MS:60000}
server.forward-headers-strategy=framework
